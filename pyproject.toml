[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vano-tool"
version = "0.1.1"
description = "Save your resources straight into Notion - a tiny menu-driven CLI"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vasu Gumber" },
]
keywords = ["notion", "cli", "notes", "resources", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

# The module is (still) the single file main.py; there are no dependencies.
[tool.setuptools]
py-modules = ["main"]

[project.urls]
Homepage = "https://github.com/Vasu-G01/vano-cli-tool"
Repository = "https://github.com/Vasu-G01/vano-cli-tool"
Issues = "https://github.com/Vasu-G01/vano-cli-tool/issues"

[project.scripts]
vano = "main:main"
